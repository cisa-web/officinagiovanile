  <script>
    
    const btn = document.getElementById('menu-toggle');
    const menu = document.getElementById('nav-menu');
    if (btn && menu) {
      btn.addEventListener('click', () => menu.classList.toggle('is-open'));
      document.addEventListener('click', (e) => {
        if (!btn.contains(e.target) && !menu.contains(e.target)) {
          menu.classList.remove('is-open');
        }
      });
    }

    
    const currentPath = window.location.pathname;
    document.querySelectorAll('.bottom-nav__item').forEach(el => {
      const href = el.getAttribute('href');
      if (href && (currentPath === href || currentPath.startsWith(href) && href !== '/')) {
        el.classList.add('active');
      } else if (href === '/' && currentPath === '/') {
        el.classList.add('active');
      }
    });

    
    document.querySelectorAll('.nav-menu a').forEach(el => {
      if (el.getAttribute('href') === currentPath) el.classList.add('active');
    });
  </script>
