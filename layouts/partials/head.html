<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- Open Graph -->
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else if .IsPage }}{{ .Summary | plainify | truncate 160 }}{{ else }}{{ .Site.Params.description }}{{ end }}">

{{ if .Params.og_image }}
  <meta property="og:image" content="{{ .Params.og_image | absURL }}">
{{ else if .Params.image }}
  {{ with .Resources.GetMatch .Params.image }}
    <meta property="og:image" content="{{ .Permalink }}">
  {{ else }}
    <meta property="og:image" content="{{ .Params.image | absURL }}">
  {{ end }}
{{ else if .Site.Params.default_image }}
  <meta property="og:image" content="{{ .Site.Params.default_image | absURL }}">
{{ else }}
  <meta property="og:image" content="{{ "/img/logo.jpg" | absURL }}">
{{ end }}

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
