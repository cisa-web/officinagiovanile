<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">

<link rel="stylesheet" href="{{ "/css/main.css" | relURL }}">
<link rel="icon" type="image/x-icon" href="{{ "/favicon.ico" | relURL }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "/favicon-32x32.png" | relURL }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ "/favicon-16x16.png" | relURL }}">
<link rel="apple-touch-icon" href="{{ "/apple-touch-icon.png" | relURL }}">

<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else if .IsPage }}{{ .Summary }}{{ else }}{{ .Site.Params.description }}{{ end }}">

{{ if .Params.image }}
  {{ $img := .Resources.GetMatch .Params.image }}
  {{ if $img }}
    {{/* Forza la conversione in JPG per massima compatibilità social */}}
    {{ $og_img := $img.Fill "1200x630 jpg q80" }}
    <meta property="og:image" content="{{ $og_img.Permalink }}">
  {{ else }}
    <meta property="og:image" content="{{ .Params.image | absURL }}">
  {{ end }}
{{ else if .Site.Params.default_image }}
  <meta property="og:image" content="{{ .Site.Params.default_image | absURL }}">
{{ else }}
  <meta property="og:image" content="{{ "/img/logo.webp" | absURL }}">
{{ end }}

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ if .Title }}{{ .Title }}{{ else }}{{ .Site.Title }}{{ end }}">
<meta name="twitter:description" content="{{ if .Description }}{{ .Description }}{{ else if .IsPage }}{{ .Summary }}{{ else }}{{ .Site.Params.description }}{{ end }}">
